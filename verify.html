<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify - Master Vacation Homes</title>

    <link rel="shortcut icon" href="img/MasterLogo.jpg" type="image/x-icon">
    <script src="js/theme.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">

    <style>
        .verify-main { max-width: 1280px; margin: 0 auto; padding: 24px; }
        .verify-intro { color: #6b7280; font-size: 14px; margin-bottom: 18px; }
        .verify-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .verify-toolbar label { font-size: 13px; color: #6b7280; display: flex; gap: 6px; align-items: center; }
        .verify-toolbar input[type="text"] { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; font-family: inherit; width: 120px; }
        .verify-toolbar input[type="text"].invalid { border-color: #dc2626; }
        .verify-toolbar button { padding: 7px 16px; border-radius: 6px; border: 1px solid #2563eb; background: #2563eb; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
        .verify-toolbar button:disabled { opacity: 0.55; cursor: not-allowed; }
        .verify-status { font-size: 13px; color: #6b7280; margin-bottom: 14px; min-height: 20px; }
        .verify-status.error { color: #dc2626; }
        .verify-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .verify-table th, .verify-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eef0f2; }
        .verify-table th { background: #f9fafb; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #6b7280; }
        .verify-table tbody tr:hover { background: #f9fafb; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
        .badge-yes { background: #dcfce7; color: #166534; }
        .badge-no { background: #f3f4f6; color: #9ca3af; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-approved { background: #dcfce7; color: #166534; }
        .badge-other { background: #fef3c7; color: #92400e; }
    </style>

    <script type="module">
        import { auth } from "./js/firebase.js";
        import { renderHeader } from "./js/nav.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.3.1/firebase-auth.js";

        renderHeader("verify");

        const PROXY_URL = "https://alisson-rochah-github-io.vercel.app";
        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                seedDefaults();
                window.loadReservations();
            } else {
                window.location.href = "index.html";
            }
        });

        function usDateOffset(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return `${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}/${d.getFullYear()}`;
        }

        // MM/DD/YYYY -> YYYY-MM-DD ; returns "" if invalid
        function usToIso(s) {
            const m = String(s || "").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (!m) return "";
            const mo = +m[1], dy = +m[2], yr = +m[3];
            if (mo < 1 || mo > 12 || dy < 1 || dy > 31) return "";
            return `${yr}-${String(mo).padStart(2, "0")}-${String(dy).padStart(2, "0")}`;
        }

        // Auto-insert slashes as the user types digits.
        function maskUsDate(input) {
            const digits = input.value.replace(/\D/g, "").slice(0, 8);
            let out = digits;
            if (digits.length >= 5) out = `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
            else if (digits.length >= 3) out = `${digits.slice(0, 2)}/${digits.slice(2)}`;
            input.value = out;
            input.classList.toggle("invalid", out.length === 10 && !usToIso(out));
        }
        window.maskUsDate = maskUsDate;

        function seedDefaults() {
            const from = document.getElementById("checkout-from");
            const to = document.getElementById("checkout-to");
            if (!from.value) from.value = usDateOffset(0);
            if (!to.value) to.value = usDateOffset(14);
        }

        window.loadReservations = async function () {
            if (!currentUser) return;
            const fromRaw = document.getElementById("checkout-from").value.trim();
            const toRaw = document.getElementById("checkout-to").value.trim();
            const fromIso = usToIso(fromRaw);
            const toIso = usToIso(toRaw);
            const btn = document.getElementById("verify-load-btn");
            const status = document.getElementById("verify-status");
            const tbody = document.getElementById("verify-tbody");

            if (!fromIso || !toIso) {
                status.textContent = "Datas inválidas — formato MM/DD/YYYY.";
                status.classList.add("error");
                return;
            }

            btn.disabled = true;
            status.classList.remove("error");
            status.textContent = "Loading reservations…";
            tbody.innerHTML = "";

            try {
                const idToken = await currentUser.getIdToken();
                const url = `${PROXY_URL}/api/mapro/reservations?checkoutFrom=${encodeURIComponent(fromIso)}&checkoutTo=${encodeURIComponent(toIso)}`;
                const res = await fetch(url, { headers: { "Authorization": "Bearer " + idToken } });
                if (res.status === 503) {
                    const body = await res.json().catch(() => ({}));
                    if (body.error === "MAPRO_NOT_LOGGED_IN") {
                        status.textContent = "MAPRO session expired. Admin: refresh the cookie in Settings.";
                        status.classList.add("error");
                        return;
                    }
                }
                if (!res.ok) {
                    const body = await res.json().catch(() => ({}));
                    status.textContent = `Error ${res.status}: ${body.error || "unknown"}`;
                    status.classList.add("error");
                    return;
                }
                const data = await res.json();
                renderRows(data.reservations || []);
                status.textContent = `${data.count} reservas com checkout entre ${fromRaw} e ${toRaw}.`;
            } catch (e) {
                status.textContent = "Network error: " + (e && e.message || e);
                status.classList.add("error");
            } finally {
                btn.disabled = false;
            }
        };

        function statusBadge(s) {
            if (!s) return `<span class="badge badge-other">—</span>`;
            const low = s.toLowerCase();
            if (low === "approved") return `<span class="badge badge-approved">${escapeHtml(s)}</span>`;
            if (low === "cancelled" || low === "canceled" || low === "declined") return `<span class="badge badge-cancelled">${escapeHtml(s)}</span>`;
            return `<span class="badge badge-other">${escapeHtml(s)}</span>`;
        }

        function yesNoBadge(v) {
            return v
                ? `<span class="badge badge-yes">Yes</span>`
                : `<span class="badge badge-no">—</span>`;
        }

        function escapeHtml(s) {
            return String(s ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderRows(rows) {
            const tbody = document.getElementById("verify-tbody");
            tbody.innerHTML = rows.map((r) => `
                <tr>
                    <td>${escapeHtml(r.bookingId)}</td>
                    <td>${escapeHtml(r.guest)}</td>
                    <td>${escapeHtml(r.propertyName)}</td>
                    <td>${escapeHtml(r.checkin)}</td>
                    <td>${escapeHtml(r.checkout)}</td>
                    <td>${yesNoBadge(r.hasBBQGrill)}</td>
                    <td>${statusBadge(r.status)}</td>
                    <td>${escapeHtml(r.integrator)}</td>
                </tr>
            `).join("");
        }
    </script>
</head>

<body>
    <header id="app-header" class="app-header"></header>

    <main class="verify-main">
        <h1>Verify</h1>
        <p class="verify-intro">
            Verificação diária de reservas. v0 — só lista reservas no período e mostra
            se cada uma tem BBQ marcado. Próximo passo: cruzar com Jobber pra flagar
            BBQ Clean faltando, em data errada, ou órfão de reserva cancelada.
        </p>

        <div class="verify-toolbar">
            <label>Checkout de
                <input type="text" id="checkout-from" placeholder="MM/DD/YYYY"
                    inputmode="numeric" maxlength="10"
                    oninput="maskUsDate(this)">
            </label>
            <label>até
                <input type="text" id="checkout-to" placeholder="MM/DD/YYYY"
                    inputmode="numeric" maxlength="10"
                    oninput="maskUsDate(this)">
            </label>
            <button id="verify-load-btn" onclick="loadReservations()">Carregar</button>
        </div>

        <div class="verify-status" id="verify-status"></div>

        <table class="verify-table">
            <thead>
                <tr>
                    <th>Booking</th>
                    <th>Guest</th>
                    <th>Property</th>
                    <th>Check-in</th>
                    <th>Check-out</th>
                    <th>BBQ?</th>
                    <th>Status</th>
                    <th>Channel</th>
                </tr>
            </thead>
            <tbody id="verify-tbody"></tbody>
        </table>
    </main>
</body>

</html>
