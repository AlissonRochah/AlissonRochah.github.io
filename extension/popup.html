<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    button.action {
      width: 100%;
      background: #FF385C;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button.action:disabled { opacity: 0.6; cursor: default; }
    #draftAll {
      margin-top: 8px;
      background: #fff;
      color: #FF385C;
      border: 1.5px solid #FF385C;
    }
    #batchControls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    button.mini {
      flex: 1;
      background: #f2f2f2;
      color: #222;
      border: none;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    button.mini:disabled { opacity: 0.5; cursor: default; }
    #summary {
      margin-top: 10px;
      font-size: 12px;
      color: #444;
      min-height: 14px;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.4;
      color: #444;
      min-height: 16px;
    }
    #status.review { color: #3B82F6; font-weight: 600; }
    #status.error { color: #B91C1C; }
  </style>
</head>
<body>
  <button id="draft" class="action" type="button">✦ Draft this conversation</button>
  <button id="draftAll" class="action" type="button">✦ Draft all unread</button>
  <div id="batchControls">
    <button id="refresh" class="mini" type="button">↻ Refresh</button>
    <button id="cancel" class="mini" type="button">✕ Cancel</button>
    <button id="reset" class="mini" type="button">⟲ Reset</button>
  </div>
  <div id="status"></div>
  <div id="summary"></div>
  <script src="popup.js"></script>
</body>
</html>
